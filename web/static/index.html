<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sfsDb Management Interface</title>
    <!-- Bootstrap v5 CSS -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link href="/static/css/styles.css" rel="stylesheet">
    <!-- Vue.js (Production Build) -->
    <script src="/static/js/vue.global.prod.js"></script>
</head>
<body>
    <div id="app" class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2 sidebar p-4">
                <h2 class="h4 mb-4">sfsDb</h2>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <div 
                            class="nav-link menu-item rounded" 
                            :class="{ active: activePage === 'status' }"
                            @click="setActivePage('status')"
                        >
                            系统状态
                        </div>
                    </li>
                    <li class="nav-item mb-2">
                        <div 
                            class="nav-link menu-item rounded" 
                            :class="{ active: activePage === 'system' }"
                            @click="setActivePage('system')"
                        >
                            系统信息
                        </div>
                    </li>
                    
                    <li class="nav-item mb-2">
                        <div 
                            class="nav-link menu-item rounded" 
                            :class="{ active: activePage === 'config' }"
                            @click="setActivePage('config')"
                        >
                            配置管理
                        </div>
                    </li>
                    <li class="nav-item mb-2">
                        <div 
                            class="nav-link menu-item rounded" 
                            :class="{ active: activePage === 'backup' }"
                            @click="setActivePage('backup')"
                        >
                            备份管理
                        </div>
                    </li>
                    
                    <li class="nav-item mb-2">
                        <div 
                            class="nav-link menu-item rounded" 
                            :class="{ active: activePage === 'memory' }"
                            @click="setActivePage('memory')"
                        >
                            内存监控
                        </div>
                    </li>
                    <li class="nav-item mb-2">
                        <div 
                            class="nav-link menu-item rounded" 
                            :class="{ active: activePage === 'key' }"
                            @click="setActivePage('key')"
                        >
                            键值监控
                        </div>
                    </li>
                    <li class="nav-item mb-2">
                        <div 
                            class="nav-link menu-item rounded" 
                            :class="{ active: activePage === 'indexStats' }"
                            @click="setActivePage('indexStats')"
                        >
                            索引统计
                        </div>
                    </li>


                    <!-- 数据查询菜单 -->
                    <li class="nav-item mb-2">
                        <div 
                            class="nav-link menu-item rounded" 
                            :class="{ active: activePage === 'dataQuery' }"
                            @click="setActivePage('dataQuery')"
                        >
                            数据查询
                        </div>
                    </li>
                    <!-- 导入导出菜单 -->
                    <li class="nav-item mb-2">
                        <div 
                            class="nav-link menu-item rounded" 
                            :class="{ active: activePage === 'importExport' }"
                            @click="setActivePage('importExport')"
                        >
                            数据导入导出
                        </div>
                    </li>
                </ul>
            </div>
            
            <!-- 主内容区 -->
            <div class="col-md-10 content p-4">
                <header class="mb-4">
                    <h1 class="h3">{{ pageTitle }}</h1>
                </header>
                
                <!-- 内容区域 -->
                <div class="content-area">
                    <!-- 系统状态 -->
                    <div v-if="activePage === 'status'">
                        <status-component />
                    </div>
                    
                    <!-- 系统信息 -->
                    <div v-if="activePage === 'system'">
                        <system-component />
                    </div>
                    
                    <!-- 配置管理 -->
                    <div v-if="activePage === 'config'">
                        <config-component />
                    </div>
                    
                    <!-- 备份管理 -->
                    <div v-if="activePage === 'backup'">
                        <backup-component />
                    </div>
                    
                    
                    
                    <!-- 内存监控 -->
                    <div v-if="activePage === 'memory'">
                        <memory-component />
                    </div>
                    
                    <!-- 键值监控 -->
                    <div v-if="activePage === 'key'">
                        <key-component />
                    </div>
                    
                    <!-- 索引统计 -->
                    <div v-if="activePage === 'indexStats'">
                        <index-stats-component />
                    </div>
                    



                    <!-- 数据查询内容 -->
                    <div v-if="activePage === 'dataQuery'">
                        <data-query-component />
                    </div>
                    <!-- 导入导出内容 -->
                    <div v-if="activePage === 'importExport'">
                        <import-export-component />
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap v5 JavaScript -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <!-- API调用模块 -->
    <script src="/static/js/api.js"></script>
    <!-- 工具函数模块 -->
    <script src="/static/js/utils.js"></script>
    <!-- 暴露Vue到全局作用域 -->
    <script>window.Vue = Vue;</script>
    <!-- 主应用逻辑 -->
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
