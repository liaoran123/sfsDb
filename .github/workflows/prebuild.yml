name: Prebuild sfsDb

on:
  push:
    branches: [ main, master, v1.0.3 ]
    tags: [ v*.*.* ]
  pull_request:
    branches: [ main, master, v1.0.3 ]

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64, mips64 ]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.3'

    - name: Build static library
      run: |
        mkdir -p build/output/lib
        mkdir -p build/output/demo
        mkdir -p build/output/examples
        
        export GOOS=linux
        export GOARCH=${{ matrix.arch }}
        export CGO_ENABLED=0
        
        # Build static library (skip for MIPS64 as c-archive is not supported)
        if [ "${{ matrix.arch }}" != "mips64" ]; then
          go build -buildmode=c-archive -o build/output/lib/sfsdb_linux_${{ matrix.arch }}.a build/main.go
        else
          echo "Skipping static library build for MIPS64 (c-archive not supported)"
        fi
        
        # Build demo program
        go build -o build/output/demo/demo_linux_${{ matrix.arch }} build/main.go

    - name: Copy examples
      run: |
        cp build/main.go build/output/examples/
        cp README.md build/output/examples/

    - name: Create release notes
      run: |
        VERSION=$(git describe --tags --always || echo "v1.0.0")
        cat > build/output/RELEASE_NOTES.md << EOF
        # sfsDb $VERSION 预编译包

        ## 包含文件

        ### 静态库文件
        - lib/sfsdb_linux_amd64.a (x86 工控机)
        - lib/sfsdb_linux_arm64.a (ARM64 网关)
        - lib/sfsdb_linux_mips64.a (MIPS64 路由器)

        ### 示例程序
        - demo/demo_linux_amd64 (x86 示例)
        - demo/demo_linux_arm64 (ARM64 示例)
        - demo/demo_linux_mips64 (MIPS64 示例)

        ### 示例源码
        - examples/main.go (完整示例代码)
        - examples/README.md (使用说明)

        ## 使用方法

        ### 运行示例程序
        \`\`\`bash
        # ARM64 平台
        ./demo/demo_linux_arm64
        \`\`\`

        ### 集成到 C/C++ 项目
        \`\`\`bash
        # ARM64 平台
        gcc main.c -L./lib -l:lib/sfsdb_linux_arm64.a -o app
        \`\`\`

        ## 支持架构
        - x86_64 (amd64)
        - ARM64 (arm64)
        - MIPS64 (mips64)

        ## 性能指标
        - 内存占用: < 5MB
        - 启动时间: < 100ms
        - 支持并发: 1000+ 并发连接

        ## 安全特性
        - 数据加密: AES-256
        - 事务支持: ACID 兼容
        - 权限控制: 细粒度权限管理
        EOF

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sfsdb-prebuild-${{ matrix.arch }}
        path: build/output

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: build/output
        merge-multiple: true

    - name: Create release package
      run: |
        mkdir -p release
        
        # Debug: List files to understand the directory structure
        echo "Current directory: $(pwd)"
        echo "Listing build/output contents:"
        ls -la build/output/
        echo "Listing build/output subdirectories:"
        find build/output -type d -exec echo {} \;
        echo "Listing build/output files:"
        find build/output -type f -exec echo {} \;
        
        # Copy files from all subdirectories
        echo "Copying files..."
        cp -r build/output/* release/
        
        # Debug: List release directory contents
        echo "Listing release directory contents:"
        ls -la release/
        
        # Create tar.gz file
        echo "Creating tar.gz file..."
        tar -czf sfsdb-prebuild-${GITHUB_REF_NAME}.tar.gz -C release .
        
        # Debug: Verify tar.gz file was created
        echo "Verifying tar.gz file:"
        ls -la *.tar.gz

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: sfsdb-prebuild-${GITHUB_REF_NAME}.tar.gz
        name: sfsDb ${GITHUB_REF_NAME}
        body: |
          ## sfsDb ${GITHUB_REF_NAME} 预编译包

          ### 包含文件
          - 静态库文件 (x86, ARM64, MIPS64)
          - 示例程序 (可直接运行)
          - 示例源码 (含完整使用示例)
          - 发布说明 (详细使用指南)

          ### 支持架构
          - x86_64 (amd64)
          - ARM64 (arm64)
          - MIPS64 (mips64)

          ### 安全特性
          - 数据加密: AES-256
          - 事务支持: ACID 兼容
          - 权限控制: 细粒度权限管理

          ### 性能指标
          - 内存占用: < 5MB
          - 启动时间: < 100ms
          - 支持并发: 1000+ 并发连接
