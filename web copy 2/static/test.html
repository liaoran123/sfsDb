<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue Test</title>
    <script src="/static/js/vue.global.min.js"></script>
</head>
<body>
    <div id="app">
        <h1>{{ message }}</h1>
        <p>Vue is working!</p>
    </div>
    
    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    message: 'Hello, Vue!'
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
